<style>
  /* Colours, fonts and basic elements */
  /* The colour palette - change a colour here and it changes everywhere */
  :root {
    --k: #111; /* black: text, active items */
    --g1: #5c5c5c; /* dark grey: secondary text */
    --g2: #9a9a9a; /* grey: labels, hints */
    --g3: #e2e2e2; /* light grey: borders */
    --g4: #f4f4f4; /* very light grey: hover backgrounds */
    --w: #fff; /* white: page background */
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--w);
    color: var(--k);
    font:
      13px/1.5 Inter,
      Helvetica Neue,
      Arial,
      sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
    padding: 0;
  }
  input {
    font: inherit;
    color: inherit;
  }
  a {
    color: inherit;
  }
  .ml {
    margin-left: auto;
  }
</style>
