<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--k:#111;--g1:#5c5c5c;--g2:#9a9a9a;--g3:#e2e2e2;--g4:#f4f4f4;--w:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--w);color:var(--k);font:13px/1.5 Inter,Helvetica Neue,Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input{font:inherit;color:inherit}
  a{color:inherit}
  .ml{margin-left:auto}

  /* header */
  .top{display:flex;align-items:center;gap:24px;padding:18px 40px 8px;flex-wrap:wrap}
  .logo{font-weight:600;letter-spacing:.22em;font-size:13px;white-space:nowrap}
  .logo span{font-weight:300;letter-spacing:.12em;margin-left:10px;color:var(--g1)}
  .rf{margin-left:auto;font-size:11px;color:var(--g2);white-space:nowrap}
  .rf b{color:var(--g1);font-weight:400}
  .rf button{margin-left:6px;color:var(--g2);font-size:13px}
  .rf button:hover{color:var(--k)}
  .gs{position:relative;width:260px;max-width:100%}
  .gs input{width:100%;border:0;border-bottom:1px solid var(--g3);padding:5px 0;outline:none;font-size:12px;background:transparent}
  .gs input:focus{border-bottom-color:var(--k)}
  .gres{position:absolute;right:0;width:420px;max-width:92vw;top:calc(100% + 6px);background:var(--w);border:1px solid var(--g3);box-shadow:0 10px 30px rgba(0,0,0,.08);z-index:40;max-height:420px;overflow:auto;display:none}
  .gres.open{display:block}
  .gres button{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid var(--g4)}
  .gres button:hover,.gres button.act{background:var(--g4)}
  .gres b{font-weight:500}
  .gres small{display:block;color:var(--g2);font-size:11px}
  .gres .none{padding:10px 14px;color:var(--g2)}

  /* service units (left) + pipelines (right) */
  .bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;padding:14px 40px 14px}
  .units,.pipes{display:flex;align-items:flex-end;gap:4px 15px;flex-wrap:wrap}
  .units button{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--g2);padding:2px 0;border-bottom:1px solid transparent}
  .units button:hover,.pipes button:hover{color:var(--k)}
  .units button.on{color:var(--k);border-bottom-color:var(--k)}
  .units button.nodata{opacity:.45}
  .ugrp{display:inline-flex;flex-direction:column;align-items:center}
  .ugrp .grp{font-size:10px;letter-spacing:.24em;padding:0 0 2px}
  .ugrp .row{display:flex;gap:12px;border-top:1px solid var(--g3);padding-top:3px}
  .pipes{gap:4px 22px;align-items:flex-start}
  .pipes button{text-align:center;color:var(--g2);padding-bottom:3px;border-bottom:1px solid transparent}
  .pipes button b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
  .pipes button small{display:block;font-size:9.5px;line-height:1.3;color:var(--g2);max-width:150px;margin:0 auto}
  .pipes button.on{color:var(--k);border-bottom-color:var(--k)}
  .pipes button.on b{font-weight:500}
  .pipes{position:relative;align-items:center}
  .pbtn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--k);border:1px solid var(--g3);border-radius:14px;padding:5px 14px}
  .pbtn:hover{border-color:var(--k)}
  .pbtn i{font-style:normal;font-size:9px;color:var(--g2);margin-left:4px}
  .pmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:50;background:var(--w);border:1px solid var(--g3);box-shadow:0 14px 40px rgba(0,0,0,.1);width:300px;padding:6px 0}
  .pmenu label{display:flex;gap:10px;align-items:flex-start;padding:8px 14px;cursor:pointer;text-align:left}
  .pmenu label:hover{background:var(--g4)}
  .pmenu input{accent-color:#111;margin:3px 0 0}
  .pmenu b{display:block;font-weight:500;font-size:12px}
  .pmenu small{display:block;color:var(--g2);font-size:11px}
  .pm-f{display:flex;justify-content:space-between;padding:8px 14px 4px;border-top:1px solid var(--g4);margin-top:4px}
  .multi{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--g2);letter-spacing:.06em;margin-left:6px;cursor:pointer;padding-bottom:2px}
  .multi input{accent-color:#111;margin:0;width:12px;height:12px}
  .inl{position:relative}
  .hpop{position:absolute;z-index:45;background:var(--w);border:1px solid var(--g3);box-shadow:0 14px 40px rgba(0,0,0,.1);width:280px;max-height:420px;display:none;flex-direction:column}
  .hpop.open{display:flex}
  .hp-s{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid var(--g4)}
  .hp-s button{text-align:left;padding:6px 14px;font-size:12px}
  .hp-s button:hover{background:var(--g4)}
  .hpop .fp-list{max-height:220px}
  .hpop .fp-f{grid-column:auto}
  .fdot{font-style:normal;font-size:8px;vertical-align:middle}

  /* maps + all accounts + filters */
  .nav{display:flex;align-items:center;gap:28px;padding:0 40px;border-top:1px solid var(--g4);border-bottom:1px solid var(--g3);flex-wrap:wrap}
  .tabs{display:flex;gap:26px;flex-wrap:wrap}
  .tabs button{padding:13px 0 11px;font-size:12.5px;color:var(--g2);border-bottom:1px solid transparent;margin-bottom:-1px}
  .tabs button b{font-weight:400;margin-right:6px;font-size:10px}
  .tabs button.on{color:var(--k);border-bottom-color:var(--k)}
  .tabs button.far{margin-left:10px;padding-left:26px;border-left:1px solid var(--g3);border-bottom-color:transparent}
  .tabs button.far.on{border-bottom-color:var(--k)}
  .fwrap{position:relative;display:flex;align-items:center;gap:10px}
  .fb{border:1px solid var(--g3);padding:4px 12px;font-size:12px;border-radius:14px;color:var(--g1)}
  .fb:hover{border-color:var(--k);color:var(--k)}
  .fb.on{border-color:var(--k);color:var(--k)}
  .fb span{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--k);color:var(--w);font-size:10px;text-align:center;margin-left:4px}
  .fclear{margin-left:4px}
  .fclear,.lnk{font-size:11px;color:var(--g2);text-decoration:underline;text-underline-offset:2px}
  .fclear:hover,.lnk:hover{color:var(--k)}
  .fpanel{position:absolute;top:calc(100% + 8px);left:0;z-index:60;background:var(--w);border:1px solid var(--g3);box-shadow:0 14px 40px rgba(0,0,0,.1);width:580px;max-width:92vw;height:480px;display:none;grid-template-columns:190px 1fr;grid-template-rows:1fr auto}
  .fpanel.open{display:grid}
  .fp-l{overflow:auto;border-right:1px solid var(--g4);padding:8px 0}
  .fp-l button{display:flex;width:100%;text-align:left;padding:6px 16px;font-size:12px;color:var(--g1)}
  .fp-l button.sub{padding-left:28px;font-size:11.5px}
  .fp-l button:hover{background:var(--g4)}
  .fp-l button.on{background:var(--g4);color:var(--k)}
  .fp-l button span{margin-left:auto;font-size:10px;color:var(--w);background:var(--k);border-radius:8px;min-width:16px;height:16px;line-height:16px;text-align:center}
  .fp-r{display:flex;flex-direction:column;min-height:0}
  .fp-t{display:flex;gap:12px;align-items:center;padding:12px 14px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g1)}
  .fp-t .lnk{letter-spacing:0;text-transform:none}
  .fp-q{margin:6px 14px;border:0;border-bottom:1px solid var(--g3);padding:5px 0;font-size:12px;outline:none}
  .fp-q:focus{border-bottom-color:var(--k)}
  .fp-list{overflow:auto;flex:1;padding:4px 0}
  .fp-list label{display:flex;align-items:center;gap:10px;padding:5px 14px;cursor:pointer;font-size:12px}
  .fp-list label:hover{background:var(--g4)}
  .fp-list label span{flex:1}
  .fp-list label small{color:var(--g2);font-size:11px}
  .fp-list input{accent-color:#111;margin:0}
  .fp-f{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:10px 14px;border-top:1px solid var(--g4)}
  .btn{border:1px solid var(--k);padding:5px 14px;font-size:11px;letter-spacing:.06em}
  .btn:hover{background:var(--k);color:var(--w)}

  /* main */
  main{padding:26px 40px 70px}
  .head{margin-bottom:18px}
  h1{font-size:17px;font-weight:500;margin:0;letter-spacing:0}
  .meta{color:var(--g2);font-size:11.5px;margin-top:3px}
  .loading,.empty{padding:60px 0;text-align:center;color:var(--g2);border:1px dashed var(--g3)}
  .hint{color:var(--g2);font-size:11px;margin:14px 0 0}

  /* matrix – full width */
  .matrix{overflow:auto}
  table.grid{border-collapse:collapse;width:100%}
  .grid th,.grid td{padding:0}
  .grid th.col{font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--g1);padding:8px 4px;text-align:center;border-bottom:1px solid var(--g3)}
  .grid th.xl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--g2);font-weight:400;padding:4px;text-align:center}
  .grid th.yl{width:24px;vertical-align:middle}
  .grid th.yl div{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--g2);font-weight:400;margin:auto}
  .grid th.row{text-align:left;font-weight:400;font-size:12px;padding:0 18px 0 0;white-space:nowrap;border-right:1px solid var(--g3);height:56px;width:170px}
  .grid th.row small{display:block;color:var(--g2);font-size:10.5px}
  .grid td.c{border:2px solid #fff;height:56px;text-align:center;position:relative}
  .grid td.c button{width:100%;height:100%;font-size:15px;font-weight:400;min-height:52px}
  .grid td.c:hover{outline:1px solid var(--k);outline-offset:-3px}
  .grid td.c.sel{outline:2px solid var(--k);outline-offset:-4px}
  .grid td.zero{color:var(--g3);text-align:center;border:2px solid #fff;background:#fafafa;font-size:12px}
  .grid td.tot,.grid th.tot{font-size:11px;color:var(--g2);text-align:center;padding:0 12px;white-space:nowrap;font-weight:400;width:80px}
  .grid th.tot{font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--g3)}
  .grid tr.sum th,.grid tr.sum td{border-top:1px solid var(--g3);height:38px;font-size:11px}
  .grid tr.sum th{text-align:left;font-weight:400;padding-right:16px;border-right:1px solid var(--g3);color:var(--g1)}
  .grid tr.sum b{font-weight:500}
  .grid td.c.hl{outline:3px solid #ffd400!important;outline-offset:-4px;box-shadow:inset 0 0 16px 3px rgba(255,212,0,.8);animation:glow 1s ease-in-out 5}
  @keyframes glow{0%,100%{outline-color:#ffd400;box-shadow:inset 0 0 16px 3px rgba(255,212,0,.8)}50%{outline-color:#fff0a0;box-shadow:inset 0 0 4px 1px rgba(255,212,0,.3)}}
  .acc.hl,tr.hl td{background:#fff8d1!important}

  /* account list under the matrix */
  .inl{margin-top:30px;border-top:1px solid var(--k)}
  .inh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:14px 0 10px}
  .inh h2{margin:0;font-size:15px;font-weight:500}
  .dtools{display:flex;gap:8px;align-items:center}
  .dtools input{width:240px;border:0;border-bottom:1px solid var(--g3);padding:5px 0;font-size:12px;outline:none}
  .dtools input:focus{border-bottom-color:var(--k)}
  .x2{font-size:20px;color:var(--g2);margin-left:6px;line-height:1}
  .x2:hover{color:var(--k)}
  .list{border-top:1px solid var(--g3)}
  .acc{padding:10px 4px;border-bottom:1px solid var(--g4);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:1px 16px}
  .acc:hover{background:var(--g4)}
  .acc .n{font-weight:500}
  .acc .pj{font-size:11px;color:var(--g1);white-space:nowrap}
  .acc .d{grid-column:1/3;color:var(--g2);font-size:11.5px}
  .acc .pjl{grid-column:1/3;font-size:11.5px;color:var(--g1)}
  .more{display:block;margin:14px auto 0;border:1px solid var(--g3);padding:6px 16px;font-size:12px}
  .more:hover{border-color:var(--k)}

  /* all accounts table */
  h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;margin:0 0 8px;color:var(--g1)}
  .sec{margin-bottom:30px}
  .tbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .tbar input{border:0;border-bottom:1px solid var(--g3);padding:5px 0;font-size:12px;min-width:260px;outline:none}
  .tbar input:focus{border-bottom-color:var(--k)}
  .tbar .cnt{color:var(--g2);font-size:11.5px}
  .tw{overflow:auto;border-top:1px solid var(--g3)}
  table.tb{border-collapse:collapse;width:100%;font-size:12px}
  .tb th{text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--g3);white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--w)}
  .tb th.s{color:var(--k)}
  .tb td{padding:7px 10px;border-bottom:1px solid var(--g4);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  .tb td b{font-weight:500}
  .tb tbody tr{cursor:pointer}
  .tb tbody tr:hover td{background:var(--g4)}
  .tb td.num{text-align:right}

  /* account details – side panel */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.12);display:none;z-index:20}
  .dim.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--w);border-left:1px solid var(--g3);box-shadow:-10px 0 40px rgba(0,0,0,.06);transform:translateX(100%);transition:transform .2s;z-index:30;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dh{padding:22px 28px 14px;border-bottom:1px solid var(--g4)}
  .dh h2{margin:0;font-size:16px;font-weight:500;padding-right:30px}
  .x{position:absolute;top:16px;right:22px;font-size:22px;line-height:1;color:var(--g2)}
  .x:hover{color:var(--k)}
  .det{overflow:auto;flex:1;padding:16px 28px 40px}
  .det h3{margin:24px 0 8px}
  .kv{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--g4)}
  .kv div{padding:6px 0;border-bottom:1px solid var(--g4);font-size:12px}
  .kv div:nth-child(odd){color:var(--g2)}
  .det table.tb td{max-width:220px}
  .det table.tb tbody tr{cursor:default}
  .loc{background:var(--g4);padding:9px 12px;font-size:12px;margin:8px 0 4px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .loc button{text-decoration:underline;font-size:12px;white-space:nowrap}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--k);color:var(--w);padding:9px 18px;font-size:12px;display:none;z-index:80;max-width:90vw}
  @media (max-width:760px){ .top,.bar,.nav,main{padding-left:16px;padding-right:16px} .rf{margin-left:0} .fpanel{grid-template-columns:130px 1fr} }
</style>
</head>
<body>
<div class="top">
  <div class="logo">PSLAB<span>PEOPLE PIPELINE</span></div>
  <div class="rf" id="rf"></div>
  <div class="gs">
    <input id="gq" placeholder="Search an account…" autocomplete="off" oninput="gSearch()" onkeydown="gKey(event)" onfocus="gSearch()">
    <div class="gres" id="gres"></div>
  </div>
</div>
<div class="bar"><div class="units" id="units"></div><div class="pipes" id="pipes"></div></div>
<div class="nav"><div class="tabs" id="tabs"></div><div class="fwrap"><div id="fbtn"></div><div class="fpanel" id="fpanel"></div></div></div>
<main id="main"><div class="loading">Reading the source file…</div></main>

<div class="dim" id="dim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dh" style="position:relative">
    <button class="x" onclick="closeDrawer()">×</button>
    <h2 id="aTitle"></h2>
    <div class="meta" id="aMeta"></div>
  </div>
  <div class="det" id="aBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ======================= constants ======================= */
var NEVER = 36600;                 // Excel dates on/before 1 Jan 2000 mean "never" in the query
var M = 30.4375;                   // days per month
var UNIT_ORDER = ['amsterdam','antwerp','bologna','london','paris','new york','stuttgart','beirut','dubai','core','marine'];
var GROUPS = [{ k:'benelux', t:'Benelux', units:['amsterdam','antwerp'], after:'antwerp' }];
var PIPES = [
  { k:1, t:'Pipeline 1', s:'paid proposal all + pitch ≥ P1 + direct supply ≥ P3' },
  { k:2, t:'Pipeline 2', s:'pitch = P0 + direct supply ≤ P2' },
  { k:3, t:'Pipeline 3', s:'claims all' }
];
var PHASES = ['P0','P1','P2','P3','P4','P5'];
var NB = ['past demand','met in','met out','contacted','not contacted'];
var VAL_EDGES = [5000,10000,25000,50000,100000,250000,500000,1000000];
var VAL_LABELS = ['0–5k','5k–10k','10k–25k','25k–50k','50k–100k','100k–250k','250k–500k','500k–1M','1M+'];
var CNT_LABELS = ['0','1','2–3','4–5','6–10','11–20','21+'];
var PRJ_LABELS = ['None','1','2–5','6–10','11+'];

var S = {
  sheets:[], acc:[], byId:{}, source:{}, checked:0,
  units:[], pipes:[1], view:1, F:{}, social:'all', SF:{},
  cell:null, list:[], listTitle:'', listMeta:'', listLimit:300,
  detail:null, hl:null, g:{ sort:{ k:'lm', d:1 }, cf:{}, q:'', limit:100 }, multiUnit:false, pm:false, pop:null, busy:false
};

/* ======================= helpers ======================= */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hKey(s){ return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function lc(v){ return v == null ? '' : String(v).toLowerCase().trim(); }
function num(v){ if (v == null || v === '') return null; var n = Number(v); return isNaN(n) ? null : n; }
function cap(s){ s = String(s == null ? '' : s); return s.replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); }).replace(/ - /g, ' – '); }
function suKey(s){ return String(s || '').toLowerCase().replace(/^pslab[\s-]+/, '').replace(/\s+/g, ' ').replace(/^newyork$/, 'new york').trim(); }
function unitLabel(u){ return u ? cap(u) : '—'; }
function phaseKey(v){ var s = String(v == null ? '' : v).trim(); if (!s) return ''; var m = s.match(/^p?\s*([0-5])\b/i); return m ? 'P' + m[1] : s.toUpperCase(); }
function pipeKey(v){ var m = String(v == null ? '' : v).match(/([1-3])/); return m ? +m[1] : null; }
function toast(t){ var e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function(){ e.style.display = 'none'; }, 3200); }
function api(fn, args){ return new Promise(function(res, rej){ var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej); r[fn].apply(r, args || []); }); }
function todaySerial(){ return Date.now() / 864e5 + 25569; }
function xlDate(s){ return new Date(Math.round((s - 25569) * 864e5)); }
function fmtXl(s, time){
  if (s == null) return '';
  if (s <= NEVER) return 'never';
  var d = xlDate(s), o = { day:'numeric', month:'short', year:'numeric', timeZone:'UTC' };
  if (time && Math.abs(s % 1) > 1e-6) { o.hour = '2-digit'; o.minute = '2-digit'; }
  return d.toLocaleString('en-GB', o);
}
function fmtTs(ms){ return ms ? new Date(ms).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : ''; }
function fmtD(d){ if (d == null) return 'never'; if (d < 60) return d + ' days'; var m = d / M; return m < 24 ? Math.round(m) + ' mo' : (m / 12).toFixed(1).replace('.0','') + ' yrs'; }
function fmtMoney(v, cur){ if (v == null) return ''; return (cur || '€') + ' ' + Math.round(v).toLocaleString('en-GB'); }
function pretty(h){
  var s = String(h).replace(/^pslab_/i, '').replace(/name$/i, '').replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').trim();
  var o = { 'owneridname':'Owner', 'serviceunitname':'Service unit', 'serviceunit':'Service unit', 'prep1count':'Pre-P1 projects', 'postp1count':'Post-P1 projects',
            'postp1amount':'Post-P1 value', 'phasegroup':'Phase', 'opportunityid':'Opportunity ID', 'accountid':'Account ID', 'countryid':'Country ID',
            'lastcontact1date':'Last contact', 'lastprojectdatein':'Last project', 'lastmeetingdate':'Last meeting', 'lastmeetingindate':'Last meeting in',
            'lastmeetingoutdate':'Last meeting out', 'accountcreation':'Account created', 'accountcreateddays':'Account age', 'originalcategory':'Original category',

  var loc = locate(a);
  var kv = [
    ['Classification', cap(a.cls)], ['Category', cap(a.category)], ['Industry', cap(a.industry)], ['Country', cap(a.country)],
    ['Service unit', unitLabel(a.su)], ['Owner', cap(a.owner)], ['Met in', cap(a.metIn)],
    ['Last meeting', a.lmDate ? fmtXl(a.lmDate) + ' (' + fmtD(a.lastMeeting) + ' ago)' : 'never'],
    ['Last contact', a.lcDate ? fmtXl(a.lcDate) + ' (' + fmtD(a.lastContact) + ' ago)' : 'never'],
    ['Last project', a.lpDate ? fmtXl(a.lpDate) + ' (' + fmtD(a.lastProject) + ' ago)' : 'never'],
    ['Pipeline', a.pipe ? PIPES[a.pipe - 1].t + ' — ' + PIPES[a.pipe - 1].s : '—'],
    ['Pre-P1 projects', a.preN], ['Post-P1 projects', a.postN], ['Post-P1 value', a.postV ? fmtMoney(a.postV, a.cur) : '—'],
    ['Projects in list', a.projects.length + (a.projPhases.length ? ' · ' + a.projPhases.join(', ') : '')],
    ['Social media', a.social.length ? socialSummary(a) : 'no'],
    ['Last validated on', a.validDate ? fmtXl(a.validDate) + ' (' + fmtD(a.validDays) + ' ago)' : '—'],
    ['Account created', fmtXl(num(F(a, 'account_creation'))) || '—']
  ];
  var h = '<div class="loc"><span>' + esc(loc.txt) + '</span><button onclick="goTo(' + a.i + ')">Show on map</button></div>';
  h += '<h3>Overview</h3><div class="kv">' + kv.map(function(x){ return '<div>' + esc(x[0]) + '</div><div>' + esc(x[1] === '' || x[1] == null ? '—' : x[1]) + '</div>'; }).join('') + '</div>';
  // projects
  var pr = a.projects.slice().sort(function(x, y){ return String(cellBy(y.s, y.j, 'Phase_Group')).localeCompare(String(cellBy(x.s, x.j, 'Phase_Group'))); });
  h += '<h3>Projects (' + pr.length + ')</h3>' + groupTables(pr, a);
  h += '<h3>Social media (' + a.social.length + ')</h3>' + groupTables(a.social, a);
  if (a.lists.length) h += '<h3>Other linked rows (' + a.lists.length + ')</h3>' + groupTables(a.lists, a);
  // any other column in the file (new query columns show up here automatically)
  var more = [];
  S.sheets.forEach(function(s){
    if (s.role !== 'accounts' && s.role !== 'merge') return;
    var j = s.role === 'accounts' ? a.i : a.mr[s.si];
    s.cols.forEach(function(c, ci){ if (DET_HIDE[s.hk[ci]] || /id$/.test(s.hk[ci]) || /validat/.test(s.hk[ci])) return; more.push('<div>' + esc(pretty(c.h)) + '</div><div>' + (j == null ? '—' : cellHtml(c.h, cv(s.si, ci, j), a)) + '</div>'); });
  });
  if (more.length) h += '<h3>More details</h3><div class="kv">' + more.join('') + '</div>';
  document.getElementById('aBody').innerHTML = h;
  document.getElementById('aBody').scrollTop = 0;
  openDrawer();
}
function groupTables(entries, a){
  if (!entries.length) return '<p class="meta">None.</p>';
  var by = {}; entries.forEach(function(e){ (by[e.s] = by[e.s] || []).push(e); });
  return Object.keys(by).map(function(si){ return rowsTable(by[si], a); }).join('');
}

/* ======================= global search ======================= */
function gSearch(){
  var q = document.getElementById('gq').value.toLowerCase().trim(), box = document.getElementById('gres');
  if (q.length < 2 || !S.acc.length) { box.classList.remove('open'); return; }
  var res = S.acc.filter(function(a){ return a.lname.indexOf(q) >= 0; });
  res.sort(function(a, b){ return (b.lname.indexOf(q) === 0) - (a.lname.indexOf(q) === 0) || a.name.length - b.name.length; });
  S.gres = res.slice(0, 15); S.gAct = 0;
  box.innerHTML = S.gres.map(function(a, i){
    return '<button class="' + (i === 0 ? 'act' : '') + '" onclick="goTo(' + a.i + ')"><b>' + esc(a.name) + '</b><small>' + esc(unitLabel(a.su)) + ' · ' + esc(locate(a).txt) + '</small></button>';
  }).join('') + (res.length > 15 ? '<div class="none">' + (res.length - 15) + ' more — keep typing</div>' : '') || '<div class="none">No account found.</div>';
  box.classList.add('open');
}
function gKey(e){
  var box = document.getElementById('gres'), btns = box.querySelectorAll('button');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!btns.length) return; S.gAct = (S.gAct + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach(function(b, i){ b.classList.toggle('act', i === S.gAct); }); }
  else if (e.key === 'Enter') { if (S.gres && S.gres[S.gAct]) goTo(S.gres[S.gAct].i); }
  else if (e.key === 'Escape') box.classList.remove('open');
}
function goTo(i){
  var a = S.acc[i]; if (!a) return;
  document.getElementById('gres').classList.remove('open');
  var loc = locate(a), adj = [];
  // only loosen what would hide this account – the numbers stay as they are otherwise
  if (S.units.length && S.units.indexOf(a.su) < 0) { if (S.multiUnit) S.units.push(a.su); else S.units = [a.su]; adj.push('service unit ' + unitLabel(a.su)); }
  if (S.pipes.length && S.pipes.indexOf(a.pipe) < 0) { if (a.pipe) S.pipes.push(a.pipe); else S.pipes = []; adj.push('pipeline'); }
  FDEF.forEach(function(f){ var sel = S.F[f.k]; if (sel && sel.length && sel.indexOf(a.fv[f.k]) < 0) { delete S.F[f.k]; adj.push(f.t.toLowerCase()); } });
  if ((S.social === 'yes' && !a.social.length) || (S.social === 'no' && a.social.length)) { S.social = 'all'; S.SF = {}; adj.push('social media'); }
  else if (!socialMatch(a)) { S.SF = {}; adj.push('social filters'); }
  S.view = loc.v; S.hl = { id:a.id, v:loc.v, key:loc.key };
  closePanel(); closeDrawer(); S.cell = { key:loc.key }; S.g = newGrid();
  renderAll();
  setTimeout(function(){
    var el = document.querySelector('td.hl');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 30);
  toast((adj.length ? 'Filters loosened to show it (' + adj.join(', ') + ') · ' : '') + loc.txt + '');
}

/* ======================= export ======================= */
var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var AUTOTABLE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
function expRecord(a){
  return {
    'Account': a.name, 'Service unit': unitLabel(a.su), 'Classification': cap(a.cls), 'Category': cap(a.category), 'Sub-category': cap(a.orig),
    'Industry': cap(a.industry), 'Country': cap(a.country), 'Owner': cap(a.owner), 'Met in': a.metIn, 'Phase (latest)': a.phase, 'Pipeline': a.pipe ? 'Pipeline ' + a.pipe : '',
    'Pre-P1 projects': a.preN, 'Post-P1 projects': a.postN, 'Post-P1 value': a.postV, 'Currency': a.cur,
    'Last meeting': a.lmDate ? fmtXl(a.lmDate) : 'never', 'Last project': a.lpDate ? fmtXl(a.lpDate) : 'never', 'Last contact': a.lcDate ? fmtXl(a.lcDate) : 'never', 'Last validated on': a.validDate ? fmtXl(a.validDate) : '',
    'Projects in list': a.projects.length, 'Project names': a.projects.map(projName).filter(Boolean).join(', '), 'Project phases': a.projPhases.join(', '), 'Social media': socialSummary(a),
    'Social links': a.social.map(function(e){ return cellBy(e.s, e.j, 'pslab_link') || ''; }).filter(Boolean).join(' ')
  };
}
var PDF_COLS = ['Account','Service unit','Classification','Category','Country','Owner','Phase (latest)','Pipeline','Post-P1 projects','Post-P1 value','Last meeting','Projects in list','Social media'];
function exportList(fmt){ doExport(fmt, S._shown || shownList(), S.listMeta); }
function doExport(fmt, list, title){
  if (!list.length) { toast('Nothing to export'); return; }
  var ctx = scopeText() + (filterText() ? ' · ' + filterText() : '');
  var stamp = new Date().toISOString().slice(0, 10);
  var fname = ('People Pipeline - ' + title.split(' › ')[0] + ' - ' + stamp).replace(/[\\/:*?"<>|]/g, '');
  toast('Preparing ' + (fmt === 'pdf' ? 'PDF' : 'Excel') + '…');
  var p = fmt === 'pdf' ? loadScript(JSPDF_URL).then(function(){ return loadScript(AUTOTABLE_URL); }) : loadScript(XLSX_URL);
  p.then(function(){
    var recs = list.map(expRecord);
    if (fmt === 'xlsx') {
      var wb = XLSX.utils.book_new();
      var ws = XLSX.utils.json_to_sheet(recs);
      ws['!cols'] = Object.keys(recs[0]).map(function(k){ return { wch: k === 'Account' ? 40 : Math.max(12, k.length + 2) }; });
      XLSX.utils.book_append_sheet(wb, ws, 'Accounts');
      // projects of these accounts (all columns of the projects sheet)
      var prows = [];
      list.forEach(function(a){ a.projects.forEach(function(e){ var s = S.sheets[e.s], o = { 'Account': a.name }; s.cols.forEach(function(c, ci){ if (!/id$/.test(s.hk[ci])) o[ci === nameCol(s) ? 'Project name' : pretty(c.h)] = fmtVal(c.h, cv(e.s, ci, e.j), a).replace(/^—$/, ''); }); prows.push(o); }); });
      if (prows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prows), 'Projects');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['People Pipeline'], ['View', title], ['Selection', ctx], ['Accounts', list.length], ['Data refreshed', fmtTs(S.source.updated)], ['Exported', fmtTs(Date.now())]]), 'Info');
      XLSX.writeFile(wb, fname + '.xlsx');
    } else {
      var L = function(s){ return String(s == null ? '' : s).replace(/[–—]/g, '-').replace(/›/g, '>').replace(/[≥]/g, '>=').replace(/[≤]/g, '<=').replace(/€/g, 'EUR').replace(/[^\x00-\xFF]/g, ''); };
      var doc = new window.jspdf.jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.text('PEOPLE PIPELINE', 32, 34);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      var lines = doc.splitTextToSize(L(title + '  |  ' + ctx + '  |  ' + list.length + ' accounts  |  data refreshed ' + fmtTs(S.source.updated)), 780);
      doc.text(lines, 32, 50);
      doc.autoTable({
        head: [PDF_COLS], body: recs.map(function(r){ return PDF_COLS.map(function(c){ return L(c === 'Post-P1 value' ? (r[c] ? fmtMoney(r[c], r.Currency) : '') : r[c]); }); }),
        startY: 56 + lines.length * 11, theme:'grid', margin:{ left:32, right:32 },
        styles:{ fontSize:6.5, cellPadding:2.5, lineColor:[217,217,217], lineWidth:.4, textColor:[0,0,0] },
        headStyles:{ fillColor:[0,0,0], textColor:[255,255,255], fontStyle:'bold' }, columnStyles:{ 0:{ cellWidth:130, fontStyle:'bold' } }
      });
      doc.save(fname + '.pdf');
    }
  }).catch(function(e){ toast('Export failed: ' + (e.message || e)); });
}

/* ======================= load / refresh ======================= */
function load(silent, msg){
  S.busy = true; renderRefresh();
  var keep = { detail:S.detail, cellKey:S.cell && S.cell.key };
  S.cell = null;
  return api('getData', []).then(function(d){
    build(d);
    S.busy = false;
    renderAll();
    if (keep.cellKey && S.view !== 4) { S.cell = { key:keep.cellKey }; render(); }
    if (keep.detail && S.byId[keep.detail]) openDetail(S.byId[keep.detail].i);
    if (msg) toast(msg + ' — data from ' + fmtTs(S.source.updated));
  }).catch(function(e){
    S.busy = false; renderRefresh();
    if (!silent || !S.acc.length) document.getElementById('main').innerHTML = '<div class="empty">Error: ' + esc(e.message || e) + '</div>';
    else toast('Refresh failed: ' + (e.message || e));
  });
}
function refresh(){ if (S.busy) return; load(true, 'Refreshed'); }
// auto refresh: check the Drive file every 10 minutes, reload when it changed – and at least every hour
setInterval(function(){
  if (S.busy) return;
  api('getStamp', []).then(function(st){
    S.checked = Date.now();
    if (st.updated !== S.source.updated || Date.now() - (S.source.loaded || 0) > 3600 * 1000) load(true, 'Data refreshed automatically');
    else renderRefresh();
  }).catch(function(){});
}, 10 * 60 * 1000);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closePanel(); closeDrawer(); } });
load(false);
</script>
